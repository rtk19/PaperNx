name: PaperNX verification
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'scripts/**'
      - 'fonts/**'
      - 'romfs/**'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'Dockerfile'
      - 'compose.yaml'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type BUILD to run the Switch ARM64 build and preview packaging'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: papernx-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmake -S . -B build-core -G Ninja -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-core --parallel 4
          ctest --test-dir build-core --output-on-failure
          python3 tests/test_package.py
  desktop:
    needs: portable
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build desktop
      - run: docker compose run --rm desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-evidence
          path: |
            verification/desktop.log
            build-desktop/Testing/Temporary/LastTest.log
            tests/fixtures/*.ppm
  switch:
    needs: [portable, desktop]
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'BUILD') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
       github.event.label.name == 'switch-build' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build switch
      - uses: actions/cache@v4
        with:
          path: prefix-mupdf-switch
          key: mupdf-arm64-${{ runner.arch }}-${{ hashFiles('Dockerfile', 'scripts/build-mupdf-switch.sh', 'include/papernx/switch_compat.h') }}
      # Always run: cached archives are checked against the real compiler fingerprint.
      - run: docker compose run --rm switch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: switch-preview-evidence
          path: |
            verification/switch.log
            dist/*
