name: PaperNX Switch Build & Verification Pipeline

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type BUILD to authorize Nintendo Switch AArch64 compilation and release packaging'
        required: true
        type: string

jobs:
  # =========================================================================
  # Stage A: Source Preflight & Tests
  # =========================================================================
  source-preflight-and-tests:
    if: ${{ inputs.confirm == 'BUILD' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential

      - name: Build and run portable core tests
        run: |
          cmake -S . -B build-core -G Ninja -DBUILD_TESTING=ON
          ninja -C build-core
          ctest --test-dir build-core --output-on-failure

      - name: Run packaging and SD layout tests
        run: |
          python tests/test_package.py

  # =========================================================================
  # Stage B: Native Desktop Reader Verification
  # =========================================================================
  native-desktop-integration:
    needs: source-preflight-and-tests
    if: ${{ inputs.confirm == 'BUILD' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native reader dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential \
            libsdl2-dev libsdl2-ttf-dev libmupdf-dev mupdf-tools

      - name: Build PaperNX native desktop executable
        run: |
          cmake -S . -B build-desktop -G Ninja -DPAPERNX_NATIVE=ON
          ninja -C build-desktop PaperNX

      - name: Verify desktop executable
        run: |
          test -x build-desktop/PaperNX
          file build-desktop/PaperNX

  # =========================================================================
  # Stage C & D & E: Switch AArch64 Cross-Compile & Verified NRO0 Packaging
  # =========================================================================
  switch-aarch64-nro-build:
    needs: source-preflight-and-tests
    if: ${{ inputs.confirm == 'BUILD' }}
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Switch portlibs via dkp-pacman
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --noconfirm \
            switch-sdl2 \
            switch-sdl2_ttf \
            switch-freetype \
            switch-libjpeg-turbo \
            switch-zlib \
            switch-bzip2 \
            switch-libpng

      - name: Cache MuPDF AArch64 cross-compile
        id: cache-mupdf
        uses: actions/cache@v4
        with:
          path: prefix-mupdf-switch
          key: mupdf-switch-1.23.11-v1

      - name: Cross-compile MuPDF for Switch AArch64
        if: steps.cache-mupdf.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/build-mupdf-switch.sh
          ./scripts/build-mupdf-switch.sh "${GITHUB_WORKSPACE}/prefix-mupdf-switch"

      - name: Build native PaperNX.nro
        run: |
          export MUPDF_PREFIX="${GITHUB_WORKSPACE}/prefix-mupdf-switch"
          make all -j$(nproc)
          test -f PaperNX.nro
          test -f PaperNX.nacp

      - name: Validate NRO0 and assemble release ZIP
        run: |
          python3 scripts/package_release.py PaperNX.nro --destination dist --version "v0.1.0"
          ls -la dist/

      - name: Upload Switch release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PaperNX-switch-v0.1.0
          path: dist/*
